<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>LeanPath</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a24;--mu:#66756d;--ac:#1f8a5b;--ac2:#e8f4ee;--bd:#e1e5df;--wa:#d9822b;--rd:#c9483d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a16;--card:#1b2620;--tx:#e8efe9;--mu:#9aaba0;--ac:#3cc789;--ac2:#1f3a2d;--bd:#2b3a32}}
:root[data-theme=dark]{--bg:#121a16;--card:#1b2620;--tx:#e8efe9;--mu:#9aaba0;--ac:#3cc789;--ac2:#1f3a2d;--bd:#2b3a32}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 84px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 8px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}
.st{background:var(--ac2);border-radius:10px;padding:9px;text-align:center}.st b{display:block;font-size:18px}.st small{font-size:11px}
button,select,input{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:3px 0 8px}
label{font-size:12px;color:var(--mu)}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer}.b.s{background:var(--ac2);color:var(--ac)}.b.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>*{flex:1}.row>.b{flex:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:110px;background:none;border:0;padding:11px 2px;color:var(--mu);font-size:12px;cursor:pointer}nav button.on{color:var(--ac);font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tip{border-left:3px solid var(--ac);padding:4px 10px;margin:8px 0}.tip.w{border-color:var(--wa)}.tip.r{border-color:var(--rd)}
.li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.chips button{margin:2px}.pill{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:20px;padding:3px 10px;font-size:12px;margin:2px}
svg{max-width:100%;display:block}@media print{nav,.chips,.b{display:none!important}}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}a{color:var(--ac)}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}.sc{overflow-x:auto}
</style></head><body><div id="app"></div><script>
const $=id=>document.getElementById(id),V=id=>$(id)?$(id).value:'';
const D=(o=0)=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4+o*864e5).toISOString().slice(0,10);
let S,T='today',R=30,O={st:0,p:{u:'met',sex:'m',act:1.375,diet:'bal'}},FQ='';
let KEY='leanpath.v1';try{KEY=localStorage.getItem('leanpath.pk')||KEY}catch(e){}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{ob:0,p:{},w:[],f:{},h2o:{},fast:null,bd:[],th:'',m:[]};
function ini(){S.m=S.m||[];S.xr=S.xr||{};S.sp=S.sp||{};S.sl=S.sl||{};S.hab=S.hab||{list:[],done:{}};S.jr=S.jr||[];S.pl=S.pl||{};S.gr=S.gr||[];S.sm=S.sm||[];S.ph=S.ph||[];S.rm=S.rm||[];S.rd=S.rd||{};S.rw=S.rw||{}}ini();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const FOODS=[["Egg (large)",72,6,.4,5],["Chicken breast 100g",165,31,0,3.6],["Salmon 100g",208,20,0,13],["Greek yoghurt 150g",100,17,6,.7],["Oats 40g",150,5,27,3],["Banana",105,1.3,27,.4],["Apple",95,.5,25,.3],["Brown rice 150g",165,3.5,35,1.3],["White rice 150g",195,4,43,.4],["Pasta 100g cooked",160,6,31,1],["Bread slice",80,3,15,1],["Avocado ½",120,1.5,6,11],["Almonds 28g",164,6,6,14],["Olive oil 1 tbsp",119,0,0,13.5],["Broccoli 100g",34,2.8,7,.4],["Sweet potato 150g",130,2.4,30,.2],["Lean beef 100g",217,26,0,12],["Tofu 100g",76,8,2,4.8],["Lentils 150g",175,13,30,.6],["Milk 250ml",122,8,12,5],["Cheddar 30g",120,7,.4,10],["Protein shake",120,24,3,1.5],["Pizza slice",285,12,36,10],["Beer 330ml",150,1.6,13,0],["Wine glass",125,.1,4,0],["Chocolate 30g",160,2,17,9]];
/* ---------- science ---------- */
const lb=k=>k*2.20462,ft=c=>c/2.54;
const fw=k=>S.p.u=='imp'?lb(k).toFixed(1)+' lb':(+k).toFixed(1)+' kg';
const wu=()=>S.p.u=='imp'?'lb':'kg',toK=v=>S.p.u=='imp'?v/2.20462:+v;
const cur=()=>S.w.length?S.w[S.w.length-1].w:S.p.w0;
function ema(){let o=[],t;S.w.forEach(x=>{t=t==null?x.w:t+.1*(x.w-t);o.push({d:x.d,w:x.w,t})});return o}
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function calc(w=cur()){const p=S.p,h=p.h,m=p.sex=='m',a=p.age,hm=h/100;
const bmr=10*w+6.25*h-5*a+(m?5:-161);
const hb=m?88.362+13.397*w+4.799*h-5.677*a:447.593+9.247*w+3.098*h-4.33*a;
const bf=p.wc&&p.nc&&(m||p.hc)?(m?495/(1.0324-.19077*Math.log10(p.wc-p.nc)+.15456*Math.log10(h))-450:495/(1.29579-.35004*Math.log10(+p.wc+ +p.hc-p.nc)+.221*Math.log10(h))-450):null;
const kma=bf!=null&&bf>2?370+21.6*(w*(1-bf/100)):null;
const tdee=(kma||bmr)*p.act,inch=ft(h)*12-60;
const dv=(m?50:45.5)+2.3*inch,rb=(m?52:49)+(m?1.9:1.7)*inch,ml=(m?56.2:53.1)+(m?1.41:1.36)*inch,hw=(m?48:45.4)+(m?2.7:2.2)*inch;
const floor=m?1500:1200,d=Math.max(1,days(p.start||D(),p.date||D(1)));
let def=Math.max(0,(p.w0-p.goal)*7700/Math.max(1,days(D(),p.date)||1));def=Math.min(def,p.hl&&p.hl!='none'?500:1000,Math.max(0,tdee-floor));
const kcal=Math.round(tdee-def),pr=Math.round(w*(p.diet=='hp'?2.2:1.8));
const fp=p.diet=='keto'?.65:p.diet=='lf'?.2:.28,fat=Math.round(kcal*fp/9),carb=Math.max(0,Math.round((kcal-pr*4-fat*9)/4));
return{bmi:w/hm/hm,prime:w/hm/hm/25,pi:w/hm/hm/hm,bmr,hb,kma,tdee,bf,whtr:p.wc?p.wc/h:null,whr:p.wc&&p.hc?p.wc/p.hc:null,dv,rb,ml,hw,lo:18.5*hm*hm,hi:24.9*hm*hm,def,kcal,pr,fat,carb,floor,lean:bf!=null?w*(1-bf/100):null,fatm:bf!=null?w*bf/100:null}}
const cat=b=>b<18.5?'Underweight':b<25?'Healthy':b<30?'Overweight':'Obese';
function adaptive(){const ds=Object.keys(S.f).filter(d=>S.f[d].length&&days(d,D())<=28&&d<D());if(ds.length<10)return null;
const e=ema().filter(x=>days(x.d,D())<=28);if(e.length<8)return null;const sp=days(e[0].d,e[e.length-1].d);if(sp<14)return null;
const avg=ds.reduce((s,d)=>s+S.f[d].reduce((a,x)=>a+x.k,0),0)/ds.length;return Math.round(avg-(e[e.length-1].t-e[0].t)*7700/sp)}
function rate(){const e=ema();if(e.length<4)return null;const l=e[e.length-1],o=e.filter(x=>days(x.d,l.d)<=14)[0];const s=days(o.d,l.d);return s<5?null:(l.t-o.t)/s*7}
const plateau=()=>{const e=ema().filter(x=>days(x.d,D())<=14);return e.length>=8&&Math.abs(e[e.length-1].t-e[0].t)<.2};
const streak=()=>{let n=0,i=S.w.some(x=>x.d==D())?0:1;for(;S.w.some(x=>x.d==D(-i));i++)n++;return n};
const xp=()=>S.w.length*10+Object.values(S.f).reduce((a,l)=>a+l.length*2,0)+Object.keys(S.h2o).length*3;
function badges(){const l=S.p.w0-cur(),B=[[S.w.length>=1,'First weigh-in'],[streak()>=7,'7-day streak'],[streak()>=30,'30-day streak'],[l>=1,'1 kg lost'],[l>=5,'5 kg lost'],[l/S.p.w0>=.05,'5% body weight'],[l/S.p.w0>=.1,'10% body weight'],[Object.values(S.f).flat().length>=30,'30 foods logged'],[cur()<=S.p.goal,'Goal reached']];return B.filter(b=>b[0]).map(b=>b[1])}
/* ---------- onboarding ---------- */
const ST=['Welcome','About you','Your goal','Lifestyle','Body measures (optional)','Your plan'];
function onb(){const p=O.p,i=O.st,u=p.u=='imp';let h='';
if(i==0)h=`<h1>LeanPath</h1><p class=mu>A science-based weight loss tracker. Your data stays on this device only.</p><div class=tip>Adaptive calorie targets · trend weight · body-fat estimates · food, water &amp; fasting tracking.</div><small>Not medical advice. Consult a professional before starting a diet.</small>`;
if(i==1)h=`<label>Units</label><select id=u><option value=met ${u?'':'selected'}>Metric (kg, cm)</option><option value=imp ${u?'selected':''}>Imperial (lb, in)</option></select><label>Sex</label><select id=sex><option value=m ${p.sex=='m'?'selected':''}>Male</option><option value=f ${p.sex=='f'?'selected':''}>Female</option></select><label>Age</label><input id=age type=number value="${p.age||''}"><label>Height (${u?'in':'cm'})</label><input id=h type=number step=.1 value="${p.h?(u?(p.h/2.54).toFixed(1):p.h):''}">`;
if(i==2)h=`<label>Current weight (${u?'lb':'kg'})</label><input id=w0 type=number step=.1 value="${p.w0?(u?lb(p.w0).toFixed(1):p.w0):''}"><label>Goal weight (${u?'lb':'kg'})</label><input id=goal type=number step=.1 value="${p.goal?(u?lb(p.goal).toFixed(1):p.goal):''}"><label>Target date</label><input id=date type=date value="${p.date||D(120)}"><div id=chk></div>`;
if(i==3)h=`<label>Activity level</label><select id=act>${[[1.2,'Sedentary'],[1.375,'Light (1–3 days/wk)'],[1.55,'Moderate (3–5 days/wk)'],[1.725,'Very active'],[1.9,'Athlete']].map(a=>`<option value=${a[0]} ${p.act==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select><label>Diet style</label><select id=diet>${[['bal','Balanced'],['hp','High protein'],['lf','Low fat'],['keto','Low carb / keto']].map(a=>`<option value=${a[0]} ${p.diet==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select><label>Health considerations</label><select id=hl>${[['none','None'],['preg','Pregnant or breastfeeding'],['dm','Diabetes or on medication'],['ed','History of eating disorder']].map(a=>`<option value=${a[0]} ${p.hl==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select><label>Why is this important to you?</label><input id=why value="${p.why||''}" placeholder="e.g. more energy for my kids">`;
if(i==4)h=`<p class=mu>Enables body-fat %, lean mass and waist ratios (US Navy method). Skip if you prefer.</p><label>Waist (${u?'in':'cm'})</label><input id=wc type=number step=.1><label>Neck (${u?'in':'cm'})</label><input id=nc type=number step=.1>${p.sex=='f'?`<label>Hips (${u?'in':'cm'})</label><input id=hc type=number step=.1>`:''}`;
if(i==5){S.p={...p,start:D()};const c=calc(p.w0),wk=c.def*7/7700;h=`<h2>Your plan</h2><div class="g g3"><div class=st><b>${c.kcal}</b><small>kcal/day</small></div><div class=st><b>${c.pr}g</b><small>protein</small></div><div class=st><b>${wk.toFixed(2)}${u?'':' kg'}</b><small>per week${u?' ('+lb(wk).toFixed(1)+' lb)':''}</small></div></div><div class=card><b>BMI ${c.bmi.toFixed(1)}</b> · ${cat(c.bmi)}<br><small>TDEE ${Math.round(c.tdee)} kcal · deficit ${Math.round(c.def)} kcal/day · fat ${c.fat}g · carbs ${c.carb}g</small></div>${safety(c,p)}`}
$('app').innerHTML=`<div class=card><small>Step ${i+1} of 6 · ${ST[i]}</small><div class=bar><i style="width:${(i+1)/6*100}%"></i></div><div style="margin-top:12px">${h}</div><div class=row style="margin-top:8px">${i?'<button class="b s" onclick=back()>Back</button>':''}<button class=b onclick=nxt()>${i==5?'Start tracking':'Continue'}</button></div></div>`;
if(i==2){['w0','goal','date'].forEach(k=>$(k).oninput=chk);chk()}}
function safety(c,p){let s='';const wk=c.def*7/7700;
if(c.bmi<18.5)s+='<div class="tip r">Your BMI is already in the underweight range. Weight loss is not advised without medical guidance.</div>';
if(p.goal<c.lo)s+=`<div class="tip w">Goal is below the healthy range (${fw(c.lo)}+). Consider a higher target.</div>`;
if(p.hl&&p.hl!='none')s+='<div class="tip r">Because of your health consideration, please get medical guidance before dieting. LeanPath caps your daily deficit at 500 kcal.</div>';if(p.age<18)s+='<div class="tip r">Under 18: please follow a doctor-led plan.</div>';
if(c.tdee-c.def<=c.floor+1)s+=`<div class="tip w">Calories were held at a safe floor of ${c.floor} kcal, so your date may be extended.</div>`;
return s||'<div class="tip">Pace looks safe (0.25–1% body weight per week is the evidence-based sweet spot).</div>'}
function chk(){const w=toK(V('w0')),g=toK(V('goal')),d=days(D(),V('date'));if(!w||!g||!d||!$('chk'))return;const wk=(w-g)/d*7,pc=wk/w*100;
$('chk').innerHTML=g>=w?'<div class="tip w">Goal should be below current weight.</div>':`<div class="tip ${pc>1?'r':pc<.25?'w':''}">${fw(wk)} per week (${pc.toFixed(2)}%/wk). ${pc>1?'That is too fast. Aim for ≤1%.':pc<.25?'Very gentle. You could move sooner.':'Realistic pace.'}</div>`}
function nxt(){const p=O.p,i=O.st,u=()=>V('u')=='imp',L=v=>v&&(p.u=='imp'?v*2.54:+v);
if(i==1){p.u=V('u');p.sex=V('sex');p.age=+V('age');p.h=p.u=='imp'?V('h')*2.54:+V('h');if(!p.age||!p.h)return alert('Please fill age and height.')}
if(i==2){p.w0=toKp(V('w0'));p.goal=toKp(V('goal'));p.date=V('date');if(!p.w0||!p.goal||p.goal>=p.w0)return alert('Enter a goal below your current weight.')}
if(i==3){p.act=+V('act');p.diet=V('diet');p.hl=V('hl');p.why=V('why')}
if(i==4){p.wc=L(V('wc'));p.nc=L(V('nc'));p.hc=L(V('hc'))}
if(i==5){S.p={...p,start:D()};S.ob=1;S.w=[{d:D(),w:p.w0}];save();return render()}
O.st++;onb()}
const toKp=v=>O.p.u=='imp'?v/2.20462:+v;const back=()=>{O.st--;onb()};
/* ---------- charts ---------- */
function chart(){const e=ema().filter(x=>R==0||days(x.d,D())<=R);if(e.length<2)return'<p class=mu>Log at least two weigh-ins to see your chart.</p>';
const W=340,H=170,P=26,g=S.p.goal,vs=e.flatMap(x=>[x.w,x.t]).concat(g),mn=Math.min(...vs)-.5,mx=Math.max(...vs)+.5,t0=new Date(e[0].d),sp=Math.max(1,days(e[0].d,e[e.length-1].d));
const X=d=>P+days(e[0].d,d)/sp*(W-P-6),Y=v=>H-18-(v-mn)/(mx-mn)*(H-30);
const pts=e.map(x=>`<circle cx=${X(x.d).toFixed(1)} cy=${Y(x.w).toFixed(1)} r=2.5 fill=var(--mu) opacity=.6 />`).join('');
const line=e.map((x,i)=>(i?'L':'M')+X(x.d).toFixed(1)+' '+Y(x.t).toFixed(1)).join('');
return`<svg viewBox="0 0 ${W} ${H}"><line x1=${P} x2=${W} y1=${Y(g)} y2=${Y(g)} stroke=var(--wa) stroke-dasharray="4 3" /><text x=${P} y=${Y(g)-3} font-size=9 fill=var(--wa)>goal ${fw(g)}</text><text x=2 y=${Y(mx-.5)+4} font-size=9 fill=var(--mu)>${(S.p.u=='imp'?lb(mx):mx).toFixed(0)}</text><text x=2 y=${Y(mn+.5)} font-size=9 fill=var(--mu)>${(S.p.u=='imp'?lb(mn):mn).toFixed(0)}</text>${pts}<path d="${line}" fill=none stroke=var(--ac) stroke-width=3 /><text x=${P} y=${H-3} font-size=9 fill=var(--mu)>${e[0].d}</text><text x=${W-60} y=${H-3} font-size=9 fill=var(--mu)>${e[e.length-1].d}</text></svg>`}
function ring(v,m,l,c='var(--ac)'){const r=34,C=2*Math.PI*r,f=Math.min(1,v/m);return`<svg viewBox="0 0 90 90" width=96><circle cx=45 cy=45 r=${r} fill=none stroke=var(--bd) stroke-width=9 /><circle cx=45 cy=45 r=${r} fill=none stroke="${c}" stroke-width=9 stroke-dasharray="${f*C} ${C}" transform="rotate(-90 45 45)" stroke-linecap=round /><text x=45 y=48 text-anchor=middle font-size=15 font-weight=700 fill=var(--tx)>${Math.round(v)}</text><text x=45 y=62 text-anchor=middle font-size=9 fill=var(--mu)>${l}</text></svg>`}
function gauge(b){const x=Math.max(0,Math.min(1,(b-15)/25))*300;return`<svg viewBox="0 0 310 38"><rect x=5 y=14 width=${300*3.5/25} height=10 fill=#4a90d9 /><rect x=${5+300*3.5/25} y=14 width=${300*6.5/25} height=10 fill=var(--ac) /><rect x=${5+300*10/25} y=14 width=${300*5/25} height=10 fill=var(--wa) /><rect x=${5+300*15/25} y=14 width=${300*10/25} height=10 fill=var(--rd) /><path d="M${5+x} 12 l-5 -10 h10z" fill=var(--tx) /></svg>`}
/* ---------- tabs ---------- */
const fT=()=>(S.f[D()]||[]),eaten=()=>fT().reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0});
function today(){const c=calc(),e=eaten(),h2=S.h2o[D()]||0,goal=Math.round(cur()*35),done=(cur()-S.p.goal)<=0,pg=Math.max(0,Math.min(100,(S.p.w0-cur())/(S.p.w0-S.p.goal)*100)),n=S.p.w0-S.p.goal;
const tw=S.w.find(x=>x.d==D());
return`<h1>Today</h1><small>${Q[new Date().getDate()%Q.length]}</small>${remB()}${S.p.why?`<small>“${esc(S.p.why)}”</small>`:''}
<div class=card><h2>Weigh-in</h2><div class=row><input id=wi type=number step=.1 placeholder="${wu()}" value="${tw?(S.p.u=='imp'?lb(tw.w).toFixed(1):tw.w):''}"><button class=b onclick=addW()>Log</button></div><small>🔥 ${streak()}-day streak · Level ${Math.floor(Math.sqrt(xp()/50))+1} · ${xp()} XP</small></div>
<div class=card><h2>Calories</h2><div class=row style="justify-content:space-around">${ring(e.k,c.kcal,'of '+c.kcal+' kcal',e.k>c.kcal?'var(--rd)':'var(--ac)')}${ring(h2,goal,'ml water','#4a90d9')}</div>
<div class="g g3" style="margin-top:8px"><div class=st><b>${Math.round(e.p)}/${c.pr}</b><small>protein g</small></div><div class=st><b>${Math.round(e.c)}/${c.carb}</b><small>carbs g</small></div><div class=st><b>${Math.round(e.f)}/${c.fat}</b><small>fat g</small></div></div>
<div class=row style="margin-top:8px"><button class="b s sm" onclick=wat(250)>+250 ml</button><button class="b s sm" onclick=wat(500)>+500 ml</button></div></div>
<div class=card><h2>Progress to goal</h2><div class=bar><i style="width:${pg}%"></i></div><small>${fw(cur())} → ${fw(S.p.goal)} · ${pg.toFixed(0)}% · ${fw(Math.max(0,cur()-S.p.goal))} to go</small></div>
<div class=card><h2>Body</h2>${gauge(c.bmi)}<div class="g g3"><div class=st><b>${c.bmi.toFixed(1)}</b><small>BMI · ${cat(c.bmi)}</small></div><div class=st><b>${Math.round(c.tdee)}</b><small>TDEE kcal</small></div><div class=st><b>${c.bf!=null?c.bf.toFixed(1)+'%':'–'}</b><small>body fat</small></div></div></div>
${mic()}<div class=card><h2>Fasting</h2>${fastUI()}</div>`}
function fastUI(){const f=S.fast;if(!f)return`<div class=chips>${[12,14,16,18,20].map(h=>`<button class="b s sm" onclick=fs(${h})>${h}h fast</button>`).join('')}</div>`;
